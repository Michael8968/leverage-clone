<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set auth token and redirect</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <p>Setting token and redirecting...</p>
    <script>
      function qs(key) {
        const params = new URLSearchParams(location.search);
        return params.get(key);
      }
      const token = qs('token');
      const redirect = qs('redirect') || '/dashboard';
      if (token) {
        try {
          localStorage.setItem('auth_token', token);
          // small delay to ensure storage is set
          setTimeout(() => { location.href = redirect; }, 200);
        } catch (e) {
          document.body.innerText = 'Failed to set token: ' + e;
        }
      } else {
        document.body.innerText = 'No token provided in query string.';
      }
    </script>
  </body>
</html>
